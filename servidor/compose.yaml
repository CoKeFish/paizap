# Servidor de Toki (con la web adentro) + túnel público, para que el terminal, la web y la app del
# celular lo alcancen desde cualquier red.
# Los secretos vienen de Doppler:
#   doppler run --project toki --config dev -- docker compose up -d --build
services:
  servidor:
    build:
      context: ..  # la imagen lleva el servidor y la compilación de app/
      dockerfile: servidor/Dockerfile
    environment:
      - TOKI_SECRET
      - COMERCIO_PUBLIC
      - TARJETAS
      - TERMINAL_TOKEN
      - ADMIN_TOKEN
      - LIMITE_DIARIO
      - TOKEN_CONTRACT
      - ZONA_HORARIA
    ports:
      - "${PUERTO_HOST:-8090}:8080"  # la placa real se conecta a http://<IP de este PC>:8090
    volumes:
      - datos:/app/datos  # tarjetas, cobros y recibos
    restart: unless-stopped

  # Túnel público (bore.pub, TCP sin TLS): deja el servidor en http://bore.pub:<TUNEL_PUERTO> para
  # que el terminal lo alcance desde cualquier red, incluido el simulador Wokwi. El puerto es fijo
  # para que la dirección grabada en el terminal no cambie. Solo para pruebas en testnet.
  tunel:
    image: ekzhang/bore:0.5.2
    command: local --local-host servidor 8080 --to bore.pub --port ${TUNEL_PUERTO:-48123}
    depends_on:
      - servidor
    restart: unless-stopped
    profiles: ["tunel"]

volumes:
  datos:
