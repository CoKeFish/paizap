# Sirve el sitio estático. Los módulos .mjs y el texto para agentes salen con su tipo correcto.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  # Detrás de otro dominio: las redirecciones van sin nombre de servidor (/demo -> /demo/).
  absolute_redirect off;

  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    application/json json;
    text/plain txt;
    image/png png;
    image/webp webp;
    image/svg+xml svg;
    font/woff2 woff2;
    model/stl stl;
    application/wasm wasm;
    application/xml xml;
  }

  location / {
    try_files $uri $uri/ =404;
  }
  # El simulador y los agentes leen estos archivos desde otras páginas y desde Node.
  location ~* \.(mjs|txt|stl)$ {
    add_header Access-Control-Allow-Origin *;
  }
}
