; Firmware de prueba del terminal Toki.
; Elige el entorno según la placa; las demás piezas se eligen en src/config.h.
;   s3     -> ESP32-S3 DevKitC-1
;   esp32  -> ESP32 clásico (DevKit V1 / WROOM-32)
;   sim-esp32, sim-s3 -> simulador Wokwi (un botón hace de tarjeta); diagramas en sim/

[platformio]
default_envs = esp32, s3, sim-esp32, sim-s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
; Deja además una sola imagen lista para grabar o simular: .pio/build/<entorno>/firmware.merged.bin
extra_scripts =
    pre:red_desde_entorno.py
    post:merge_firmware.py
; Red y servidor: red_desde_entorno.py los toma de variables de entorno al compilar
; (TOKI_WIFI_SSID, TOKI_WIFI_CLAVE, TOKI_SERVIDOR_URL, TERMINAL_TOKEN). Vacías = modo prueba.
;   doppler run --project toki --config dev -- pio run
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit SH110X@^2.1.10
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit PN532@1.3.4
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    miguelbalboa/MFRC522@1.4.12
    obsttube/MFRC522_NTAG424DNA@1.0.1
    chris--a/Keypad@3.1.1

[env:s3]
board = esp32-s3-devkitc-1
; Monitor serie por el USB nativo de la placa (el puerto que aparece como "USB Serial Device")
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
board = esp32dev

[env:sim-esp32]
board = esp32dev
build_flags = -DTOKI_SIM

[env:sim-s3]
board = esp32-s3-devkitc-1
build_flags = -DTOKI_SIM
